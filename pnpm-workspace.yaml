# pnpm 12 ignores the "pnpm" field in package.json. Build scripts must be allowed here,
# or the install fails with ERR_PNPM_IGNORED_BUILDS. Approve with `pnpm approve-builds <pkg>`.
allowBuilds:
  esbuild: true
  # Pulled in by next-intl's message extractor, which we don't use.
  '@parcel/watcher': false
  '@swc/core': false
