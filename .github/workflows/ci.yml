name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # A new push to a PR cancels its older run; runs on main always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Harmless placeholders so the config loads and the build runs. Not secrets, not real keys.
  PAYLOAD_SECRET: ci-placeholder-payload-secret
  DATABASE_URI: file:./data/ci.db
  NEXT_PUBLIC_SERVER_URL: http://localhost:3000
  STRIPE_SECRET_KEY: ci-placeholder-stripe-secret
  NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ci-placeholder-stripe-publishable
  STRIPE_WEBHOOKS_SIGNING_SECRET: ci-placeholder-stripe-webhook-secret
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  check:
    # The same steps in each setup of design 4.9: each module must work with the other one off.
    # LIGHT_CI_MODULES switches modules without editing light.config.ts (src/config/modulesOverride.ts).
    # Every step runs a package.json script, so CI and local runs stay the same.
    name: "${{ matrix.setup }}: typecheck, lint, test, build"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - setup: Both modules
            modules: cms,shop
          - setup: CMS only
            modules: cms
          - setup: Shop only
            modules: shop
    env:
      LIGHT_CI_MODULES: ${{ matrix.modules }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # pnpm version from `packageManager` in package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      # `payload build` regenerates the types. With a module off they go to a scratch file
      # (src/core/generatedTypes.ts), so `next build` type-checked every module against the
      # committed src/payload-types.ts. Check that the build left that file as committed.
      - name: The build left src/payload-types.ts as committed
        run: git diff --exit-code -- src/payload-types.ts

  generated:
    # The committed generated files describe both modules: generate:check always compares with
    # both on (scripts/generate-check.mjs).
    name: Generated files are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate:check

  e2e:
    # The end-to-end test (S25): browse → cart → pay → order in Chromium, against the dev server
    # with both modules on (design 4.9). CI has no Stripe keys and must never get them (the repo is
    # public), so it pays a fake Stripe: tests/e2e/stripe-stub/ (E2E_STRIPE=stub, see
    # tests/e2e/support/env.ts). Locally `pnpm test:e2e` pays in Stripe's test mode.
    name: "End-to-end: browse, cart, pay, order (Stripe stubbed)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      E2E_STRIPE: stub
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Playwright's version (the browser cache key)
        id: playwright
        run: echo "version=$(node -p "require('./package.json').devDependencies['@playwright/test']")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # Chromium only. With the cache hit it only installs the system libraries it needs.
      - run: npx playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Upload the report, traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  docker:
    # Builds the production image on every PR. Nothing is pushed.
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: light-commerce:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: schema
          push: false
          load: true
          tags: light-commerce:ci-schema
          cache-from: type=gha
      - name: Smoke test (migrates a new volume, serves the seeded demo, an uploaded photo)
        run: |
          docker volume create smoke-data
          # A new volume and no schema push: the server applies the migrations (prodMigrations) on
          # the first request that initialises Payload, as on the demo; the seed below does too. With the shop on, it stops without its Stripe keys
          # (placeholders: nothing calls Stripe here).
          docker run -d --name smoke -p 3000:3000 -v smoke-data:/app/data -e PAYLOAD_SECRET=ci-placeholder-payload-secret -e SMTP_HOST=localhost -e SMTP_PORT=1025 \
            -e STRIPE_SECRET_KEY=ci-placeholder-stripe-secret -e STRIPE_WEBHOOKS_SIGNING_SECRET=ci-placeholder-stripe-webhook-secret light-commerce:ci
          ok=
          for i in $(seq 1 30); do
            curl -fs http://127.0.0.1:3000/healthz && ok=1 && break
            sleep 2
          done
          [ -n "$ok" ] || { docker logs smoke; exit 1; }
          # The demo company, as the demo loads it: the seed in the schema image (migrated database,
          # NODE_ENV=production), demo/ from the checkout, next to the running server.
          docker run --rm -v smoke-data:/app/data -v "$PWD/demo:/app/demo:ro" -e PAYLOAD_SECRET=ci-placeholder-payload-secret \
            -e SEED_OWNER_EMAIL=ci@example.com -e SEED_OWNER_PASSWORD=ci-Throwaway-7q4z-k9wd \
            --entrypoint ./node_modules/.bin/payload light-commerce:ci-schema run src/seed/cli.ts || { docker logs smoke; exit 1; }
          # Pages: / goes to the default locale (307), the home pages and the shop answer 200.
          redirect=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' http://127.0.0.1:3000/)
          case "$redirect" in "307 "*/fr) ;; *) echo "/ answered: $redirect"; docker logs smoke; exit 1 ;; esac
          for path in /fr /en /fr/shop; do
            curl -fs -o /dev/null http://127.0.0.1:3000$path || { echo "$path failed"; docker logs smoke; exit 1; }
          done
          # Media: log in as the seeded owner, upload a fixture, fetch it back. Guards the
          # standalone trace (FLU-67): file serving needs modules the tracer used to leave out.
          token=$(curl -fs -X POST http://127.0.0.1:3000/api/users/login -H 'content-type: application/json' \
            -d '{"email":"ci@example.com","password":"ci-Throwaway-7q4z-k9wd"}' | sed 's/.*"token":"\([^"]*\)".*/\1/')
          curl -fs -X POST http://127.0.0.1:3000/api/media -H "Authorization: JWT $token" \
            -F '_payload={"alt":"CI fixture"}' -F 'file=@tests/fixtures/small-300x200.png;type=image/png' >/dev/null || { docker logs smoke; exit 1; }
          for f in small-300x200.png small-300x200-300x200.webp; do
            curl -fs -o /dev/null http://127.0.0.1:3000/api/media/file/$f || { echo "media $f failed"; docker logs smoke; exit 1; }
          done
      - if: always()
        run: docker rm -f smoke || true; docker volume rm smoke-data || true
